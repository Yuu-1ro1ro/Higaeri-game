 H.memories={memorySwing:{title:'01 / ブランコの約束',text:'「百まで数えたら、迎えにきて」\n私は百まで数えた。紬は、百の先にも数があることを、まだ知らなかった。'},memoryShoes:{title:'02 / 左右の長靴',text:'紬はいつも長靴を逆に履いた。叱ると「足が、けんかしないように」。\nそれから私は、履かせ直す前に笑うようになった。'},memoryCandy:{title:'03 / 星を数える',text:'「おねえちゃんの分、取っといた」\n缶の中には白い金平糖だけ。私が白を好きだと言ったことはない。紬が好きだった色だ。'},memoryPhoto:{title:'04 / 写真にいない人',text:'祭りの写真。私はカメラを見ている。紬は私を見ている。\n写真の裏に「ねえちゃんが、たのしそうだったひ」。'},memoryTape:{title:'05 / 言い直した声',text:'録音の中で私は言った。「もう、ついてこないで」\nそのあと、小さな声。「……うそ。ちょっと、待って」\n紬に届いたのは、最初のほうだけだった。'},memoryBox:{title:'06 / 渡されなかった手紙',text:'『ねえちゃんへ。わたしがいなくても、たのしいひをつくってね。\nでも、ときどき、わたしのすきなあめをかってね。つむぎ』\n子どもの遺書ではない。引っ越す友だちの真似をした、ただの手紙だった。'},memoryTree:{title:'07 / 結び直す',text:'紬は、ほどける結び方しかできなかった。\n「また会ったら、ねえちゃんが結んで」\nそれは永遠に離れない約束ではなく、もう一度会えるという信頼だった。'}};
 H.lore={listener:{name:'耳待ち',text:'足音を集めて歩く女。走る音を遠くから聞く。近くでは走らず、草陰で Ctrl を押して息をひそめる。灯りは消さなくてもよい。'},umbrella:{name:'傘喰い',text:'灯りを雨と間違える、裏返った傘。光を向けると追ってくる。F で灯りを消し、走らずにすれ違う。'},longneck:{name:'橋のぞき',text:'水に映る顔を数える首。こちらが動くと近づく。橋で現れたら、動かずに灯りを向ける。しばらくすると水へ戻る。'},parade:{name:'紙の列',text:'祭りに置いていかれた紙人形。一定の道を巡り、光にも足音にも反応しない。列から距離を取り、通り過ぎるのを待つ。'}};
})(HG);

</script><script>
'use strict';
(function(H){
 const line=(s,t)=>({s,t});const M=t=>line('澪',t),T=t=>line('紬の声',t),N=t=>line('',t),O=t=>line('お面屋',t);
 H.objective=function(s){const f=s.flags;if(!f.letter)return '家の前の、赤い郵便受けを調べる';if(!f.bell)return '住宅街の東側で、鳴っている電話を探す';if(!f.mask)return '東の商店街へ。お面屋と話し、舞台裏を調べる';if(!f.mirror)return '風鈴の音を確かめ、お面屋にお面を返す';if(!f.key)return '商店街の東、旧校舎の校門を調べる';if(!f.schoolTruth)return '校門の右にある「忘れもの箱」を開ける';if(!f.thread)return '橋を渡り、東岸の紙の舟を調べる';if(!f.altar)return '東の灯守神社へ。石碑を読み、祭壇に品を返す';if(!f.name)return '境内の井戸を調べてから、祭壇の奥の少女に会う';return '祭壇の奥で、紬に名前を呼びかける'};
 H.intro=function(G){G.say([N('八月三十一日。午後十一時四十七分。\n妹がいなくなって、ちょうど一年。'),M('家の時計は、あの日から二分遅れている。\n直せばいいのに。直したら、本当に一年たってしまう。'),N('玄関で、濡れた足音がした。\n郵便受けの奥に、小さな赤い封筒。'),T('ねえちゃん。\nおまつりが終わる前に、むかえにきて。'),M('紬……？\nこの字を、私は知っている。')],()=>{G.chapter(0);G.toast('WASD / 矢印で歩く。近くで E を押すと調べられます。')})};
 H.interact=function(G,o){const s=G.s,f=s.flags;const grant=(key)=>{f[key]=true;if(H.items[key]&&!s.items.includes(key))s.items.push(key);G.saveAuto();};const remember=(id,lines)=>{if(s.memories.includes(id)){G.say([N(H.memories[id].text)]);return}G.say(lines.concat([N('手帳に「'+H.memories[id].title+'」を書き留めた。')]),()=>{s.memories.push(id);G.saveAuto();G.toast('記憶 '+s.memories.length+' / 7　—　J で手帳を開く')})};
 if(o.type==='jizo'){G.say([N('誰かが供えた、まだ新しい水。\nここにいる間は、追ってくる足音が遠ざかる。'),M('忘れないうちに、ここまでのことを書いておこう。')],()=>{s.checkpoint={map:s.map,x:s.x,y:s.y};G.saveAuto();G.saveMenu()});return}
 switch(o.id){
 case 'homeDoor':G.say([M(f.letter?'帰っても、まだ誰もいない。\n……紬に会ってからにしよう。':'玄関の外に、赤い封筒が見えた。')]);break;
 case 'mailbox':if(f.letter){G.say([N('『ねえちゃん。むかえにきて』\n差出人の欄だけ、雨に濡れていない。')]);break}G.say([N('封筒の中には、子どもの描いた地図。\n家。お面の店。橋。山の上の神社。'),M('帰り道の地図だ。\n紬がひとりで帰れるように、私が描いた……。'),N('裏側に、見覚えのない一行。\n『でんわが鳴ったら、なまえを言わないで』'),N('遠くで、公衆電話が鳴りはじめた。')],()=>{grant('letter');G.lore('listener');G.subtitle('ちりん。どこかで、鈴が鳴った。');G.toast('東の公衆電話へ。J：手帳 / M：地図')});break;
 case 'notice':G.say([N('【夜間のお願い】\n知らない足音が重なったら、走らないこと。'),N('草陰で Ctrl を押して息をひそめてください。\nお地蔵さまの灯りのそばは安全です。'),M('町内会の掲示板に、こんなこと書いてあった……？')],()=>G.lore('listener'));break;
 case 'phone':if(!f.letter){G.say([N('受話器が、ひとりでに揺れている。\n先に、家の郵便受けを確かめよう。')]);break}if(f.bell){G.say([T('すずは、こえ。かがみは、おもいで。\nいとは、やくそく。'),N('受話器の向こうで、誰かが百を数えている。')]);break}G.say([N('受話器は、川の水のように冷たかった。'),T('もしもし。……あなたは、だあれ？'),M('わたしは――'),N('封筒の文字が、手の中で赤くにじむ。\n『なまえを言わないで』')],()=>G.choose('受話器に、何と答える？',[{text:'「妹を、迎えにきました」',action:()=>phoneEnd(false)},{text:'黙って、向こうの息を聞く',action:()=>phoneEnd(true)}]));break;
 case 'memorySwing':remember(o.id,[N('風がないのに、右のブランコだけ揺れている。'),T('ねえちゃん、百まで！　途中で見ちゃだめ！'),M('九十八。九十九。……百。\nあのとき、もっと早く目を開けていれば。'),N('鎖が一度だけ鳴って、止まった。')]);break;
 case 'memoryShoes':remember(o.id,[N('黄色い長靴。左足と右足が、反対に並んでいる。'),T('こうしたら、足がけんかしないでしょ。'),M('そういうこと、よく言ってた。\n私が覚えていないだけで、もっとたくさん。')]);break;
 case 'marketSign':G.say([N('【宵待ち祭・迷子のご案内】\nお名前をなくしたお子さまは、お面屋へ。'),N('【雨天のご案内】\n傘喰いは灯りに寄ります。傘が開いたら F で灯りを消し、静かにお通りください。'),N('一番下だけ、新しい文字。\n『帰る場所と、帰りたい場所は、おなじとは限らない』')],()=>G.lore('umbrella'));break;
 case 'stall':if(f.mirror){G.say([O('橋の向こうに、忘れもの箱がある。\n自分に都合のいいものだけ、持ち帰るなよ。'),O('神社では、まず思い出せ。それから呼べ。\n約束は、最後だ。')]);break}if(!f.mask){G.say([O('いらっしゃい。顔なら、いくらでもあるよ。\nいい姉の顔。泣かない子の顔。忘れたふりの顔。'),M('妹を捜しています。赤い傘を持った……'),O('ここじゃ、誰もが誰かを捜してる。\n舞台の裏に、顔をつけそこねたお面がある。持っておいで。'),O('裏道の傘には光を向けるな。\n暗がりでだけ、見えるものもある。')],()=>{f.stallTalk=true;G.lore('umbrella')});break}if(!f.chimes){G.say([O('そのお面は、何の音を聞いていた？'),M('音……？'),O('店の西に、三つの風鈴がある。\n家から川へ、あの子が歩いた順番で聞いておいで。')]);break}G.say([O('内側を見たかい。\nあんたの妹は、どんな子だった？'),M('いつも笑って、私についてきて……'),O('それは、あんたの後ろから見た顔だ。\nあの子は、何を考えていた？')],()=>G.choose('あの子の気持ちを、私は――',[{text:'「まだ、わかりません」',action:()=>mirrorEnd(true)},{text:'「私と帰りたいはずです」',action:()=>mirrorEnd(false)}]));break;
 case 'mask':if(f.mask){G.say([N('舞台には、小さな足跡がふたつ。\n来た跡だけで、帰った跡がない。')]);break}G.say([N('お面の裏側に、爪で書いたような文字。\n『わからないを、うそでふさがないで』'),M('笑っている顔なのに、\n内側は、こんなに濡れている。')],()=>{grant('mask');G.toast('「裏返しのお面」を手に入れた')});break;
 case 'chimes':if(f.chimes){G.say([N('風。鳥。水。\n風鈴が、帰り道の順番で鳴った。')]);break}G.say([N('三つの短冊。風の絵、鳥の絵、水の絵。\n下に、子どもの文字。'),T('いえを出たら、かぜ。\nおみせの屋根で、とり。はしの下には、みず。')],()=>G.choose('地図の道順に、風鈴を鳴らす。',[{text:'風 → 鳥 → 水',action:()=>{f.chimes=true;G.audio.chime();G.say([N('澄んだ音が、通りの奥まで続いた。'),M('そうだ。紬は音で道を覚えていた。\n字がまだ、少ししか読めなかったから。')],()=>G.saveAuto())}},{text:'水 → 風 → 鳥',action:()=>G.say([N('短冊が静かに揺れる。\n家から橋まで、地図をたどってみよう。')])},{text:'鳥 → 水 → 風',action:()=>G.say([N('音が途中で途切れた。\n家を出たときの音が、最初だった。')])}]));break;
 case 'memoryCandy':remember(o.id,[N('店先の缶に、白い金平糖。\n青いものだけが、一粒もない。'),T('ねえちゃんの分、ちゃんと取っといたよ。'),M('白いのが好きなのは、紬のほうなのに。\n……大事なものを、くれてたんだ。')]);break;
 case 'memoryPhoto':remember(o.id,[N('現像されなかった写真が、一枚だけある。'),M('私、こんな顔で笑ってたんだ。\nこの日、紬とはぐれる少し前。'),N('写真の端で、紬は祭りではなく、姉を見ている。'),M('あの日を、全部悪い日にしてしまっていた。\n楽しかった時間まで、なかったことに。')]);break;
 case 'school':if(f.key){G.say([N('校門の右側に、古い忘れもの箱。\n鍵の札と同じ、赤い丸印がついている。')]);break}G.say([N('校門は閉じている。\n金網に、小さな鍵が結んであった。'),M('紬の、図工の名札。\n名前が……消されてる。'),T('ここなら、なくしたものを、\nせんせいが取っておいてくれるから。'),N('鍵の札には「言えなかったこと」。')],()=>{grant('key');G.toast('忘れもの箱の鍵を手に入れた')});break;
 case 'locker':if(!f.key){G.say([N('赤い丸印のついた鍵穴。\n校門の金網に、同じ印が見える。')]);break}if(f.schoolTruth){G.say([N('空っぽの箱の底に、一行。\n『だれかをわすれることと、あしたへいくことは、ちがう』')]);break}G.say([N('中には、町の古い広報誌。\n「昨年の増水事故から一年」。'),M('……知っている。\n本当は、最初から知っていた。'),N('水無月川の増水。行方不明の児童、一名。\n捜索は九月七日に打ち切られた。'),M('私はあの日、「ついてこないで」と言った。\nだから紬は、ひとりで橋へ行った。'),T('ねえちゃん。\nひとつのことばで、ぜんぶ決めないで。'),N('箱の底から、遠い水音。\n橋の東岸に、小さな白い舟が見える。')],()=>{grant('schoolTruth');G.lore('longneck');G.subtitle('川の上では、足音を止めて。灯りは消さないで。')});break;
 case 'riverSign':G.say([N('【橋のぞき】\n渡る足を数え、動く影を追う。'),N('その首を見たら、足を止めよ。\n灯りを向け、三つ息を数えよ。水に帰るまで、動くな。'),M('止まって、顔のほうに灯りを……。\nマウスでも、灯りの向きを変えられる。')],()=>G.lore('longneck'));break;
 case 'boat':if(!f.schoolTruth){G.say([N('紙の舟には、鍵穴の絵。\n旧校舎に、まだ読んでいない言葉がある。')]);break}if(f.thread){G.say([N('舟は岸を離れた。\n流れに逆らわず、ゆっくりと。')]);break}G.say([N('舟を開くと、赤い糸がほどけた。\n紬の傘を、私が縫ったときの糸。'),T('むかえにきてって、書いてごめんね。\nそう書かないと、ねえちゃん、来ないと思った。'),M('帰りたいんじゃ、ないの？'),T('ねえちゃんが、ずっとあの日にいるから。\nわたし、帰り道を描き直したの。'),N('舟の裏に、神社の絵。\n家から神社への線ではない。神社から、家への線。'),M('迎えにきたのは……私じゃ、なかった。')],()=>{grant('thread');G.chapter(3);G.toast('「約束の糸」を手に入れた。東の神社へ')});break;
 case 'memoryTape':remember(o.id,[N('再生ボタンだけが、きれいに磨かれている。'),line('録音の中の澪','もう、ついてこないで。友だちと行くって言ったでしょ。'),N('長い沈黙。そのあと、雨に消えそうな声。'),line('録音の中の澪','……うそ。ちょっと、待って。紬。'),M('言い直したんだ、私。\n言い直せなかったと思ってた。'),N('それでも、届かなかった言葉はある。\n言ったことも、言えなかったことも、同じ声の中にあった。')]);break;
 case 'memoryBox':remember(o.id,[N('ビニールに包まれた、折り目だらけの手紙。'),T('ねえちゃんへ。\nわたしがいなくても、たのしいひをつくってね。'),M('こんな手紙……いつ……。'),N('封筒には、引っ越した友だちと同じ花のシール。\n別れを知っていたのではない。手紙ごっこだった。'),M('紬のすること全部を、\nあの日のための「しるし」にしなくていいんだ。')]);break;
 case 'shrineTablet':G.say([N('【灯返り】\n死者を戻す祭りにあらず。残された者を、朝へ返す祭りなり。'),N('まず、鏡でその人を思い出せ。\n次に、鈴でその名を呼べ。\n最後に、糸で明日の約束を結べ。'),N('名前を役目に変えるな。\n姉も、妹も、その人のすべてではない。'),N('【紙の列】\n列はただ巡る。追いかけず、道を譲れ。')],()=>{f.ritualHint=true;G.lore('parade')});break;
 case 'memoryTree':remember(o.id,[N('枝に、ほどけかけた赤いリボン。\n蝶の片方だけ、輪になっていない。'),T('かたく結んだら、また会ったとき、ほどけないよ。'),M('ほどけても、よかったんだ。\n結び直せるって、紬は信じてた。')]);break;
 case 'well':if(f.name){G.say([N('井戸には、もう声がない。\n水面に、ひとり分の顔が映っている。')]);break}if(s.memories.length<7){G.say([line('井戸の声','あの子は「妹」になる前に、何という子だった。\nおまえは「姉」でないとき、何という人だった。'),M('紬。……澪。'),line('井戸の声','名前だけでは、まだ軽い。\n町に残した七つの時間を、持っておいで。'),N('集めた記憶：'+s.memories.length+' / 7。\n地図 M と手帳 J で、残っている場所を確かめられる。\n記憶が揃わなくても、少女には会える。')]);break}G.say([line('井戸の声','楽しい日も、意地悪な日も、言い直した声も。\n一人の子に、ちゃんと返してきたか。'),M('私は、いい姉だったかどうかばかり考えていた。\n紬が、どんな子だったかじゃなくて。'),T('みおねえ。'),M('……つむ。'),N('井戸の水面に、ふたりが映った。\nもう一度見たとき、澪だけになっていた。')],()=>{grant('name');G.toast('「ふたりの呼び名」を思い出した')});break;
 case 'altar':if(!f.thread){G.say([N('三つの窪み。\n声の鈴、記憶の鏡、約束の糸が必要だ。')]);break}if(f.altar){G.say([N('鈴の音は、もう外ではなく胸の奥にある。\n祭壇の向こうに、赤い傘の少女が待っている。')]);break}G.say([N('祭壇に三つの窪み。\n「思い出す。呼ぶ。約束する。」')],()=>G.choose('どの順番で、品を返す？',[{text:'鏡 → 鈴 → 糸',action:()=>{grant('altar');G.audio.chime();G.say([N('鏡に、笑っていない紬が映る。\n怒っている。すねている。眠そうにしている。'),M('笑っている顔だけ、残そうとしてごめん。'),N('鈴が鳴る。糸が、夜の中へ伸びる。\n赤い傘の下で、少女が顔を上げた。')],()=>G.chapter(4))}},{text:'鈴 → 糸 → 鏡',action:()=>G.say([N('鈴は鳴らなかった。\n名前を呼ぶ前に、その人を思い出さなくては。')])},{text:'糸 → 鏡 → 鈴',action:()=>G.say([N('糸がほどけた。\n約束は最後。境内の石碑に、順番が書かれている。')])}]));break;
 case 'sister':if(!f.altar){G.say([N('赤い傘の向こうに、人影。\n祭壇の灯りが戻るまで、声は届かない。')]);break}G.say([line('紬','おそかったね。百のあとも、いっぱい数えたよ。'),M('紬。帰ろう。\n……そう言いに、来たのに。'),line('紬','ねえちゃんは、わたしが帰らないと、\n帰っちゃいけないって思ってるでしょ。'),M('帰ったら、忘れてしまいそうで。\n笑ったら、置いていくみたいで。'),line('紬','わたしが好きだったねえちゃん、\nずっと泣いてる人じゃなかったよ。'),N('差し出された手は冷たくなかった。\nあの日の体温を、澪の手がまだ覚えていた。')],()=>finalChoice());break;
